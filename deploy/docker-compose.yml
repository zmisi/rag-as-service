# Local dev stack: PostgreSQL + API + index worker + Web (+ optional Nginx)
# Usage (from repo root):
#   cp deploy/.env.example .env
#   docker compose -f deploy/docker-compose.yml up --build

services:
  db:
    image: rag-as-service-db:latest
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_app}
      POSTGRES_DB: ${POSTGRES_DB:-lxzxai_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rag_app} -d ${POSTGRES_DB:-lxzxai_rag}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: rag-as-service-backend:latest
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    # Repo-root .env (compose file lives under deploy/; without this,
    # ${QWEN_API_KEY} interpolates empty and chat fails).
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag_app}:${POSTGRES_PASSWORD:-rag_app}@db:5432/${POSTGRES_DB:-lxzxai_rag}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SECRET_KEY: ${SECRET_KEY:-change_me}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pb_session}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.lxzxai.com}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      APEX_HOST: ${APEX_HOST:-lxzxai.com}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      PYTHONPATH: /app/src
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-local-dev-proxy-secret}
      # Prefer values from env_file (../.env). Do not set QWEN_API_KEY here
      # with ${QWEN_API_KEY:-} — empty interpolation would override env_file.
      # Dedicated worker consumes ingest_jobs; keep sync off in compose.
      INGEST_SYNC_ON_PUBLISH: ${INGEST_SYNC_ON_PUBLISH:-false}
      INGEST_JOB_STUCK_AFTER_SECONDS: ${INGEST_JOB_STUCK_AFTER_SECONDS:-1800}
      # Docling models (Hugging Face). Set HF_ENDPOINT only if needed (e.g. mirror).
      # Do not default to hf-mirror.com — some networks resolve it to 0.0.0.0.
      HF_HOME: ${HF_HOME:-/app/var/hf-cache}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../apps/api/src:/app/src
      - ../apps/api/pyproject.toml:/app/pyproject.toml
      - ../apps/api/alembic:/app/alembic
      - ../apps/api/alembic.ini:/app/alembic.ini
      - api_storage:/app/var/storage
      - hf_cache:/app/var/hf-cache
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn rag_api.main:app --reload --host 0.0.0.0 --port 8000

  ingest-worker:
    image: rag-as-service-backend:latest
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag_app}:${POSTGRES_PASSWORD:-rag_app}@db:5432/${POSTGRES_DB:-lxzxai_rag}
      AUTO_MIGRATE: "false"
      SECRET_KEY: ${SECRET_KEY:-change_me}
      PYTHONPATH: /app/src
      INGEST_SYNC_ON_PUBLISH: "false"
      INGEST_WORKER_POLL_INTERVAL_SECONDS: ${INGEST_WORKER_POLL_INTERVAL_SECONDS:-2}
      INGEST_WORKER_BATCH_SIZE: ${INGEST_WORKER_BATCH_SIZE:-5}
      INGEST_JOB_STUCK_AFTER_SECONDS: ${INGEST_JOB_STUCK_AFTER_SECONDS:-1800}
      QWEN_EMBEDDING_ENABLED: ${QWEN_EMBEDDING_ENABLED:-false}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-800}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-100}
      HF_HOME: ${HF_HOME:-/app/var/hf-cache}
    volumes:
      - ../apps/api/src:/app/src
      - ../apps/api/pyproject.toml:/app/pyproject.toml
      - api_storage:/app/var/storage
      - hf_cache:/app/var/hf-cache
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: rag-ingest-worker

  web:
    image: rag-as-service-web:latest
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      API_BACKEND_URL: http://api:8000
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-local-dev-proxy-secret}
      APEX_HOST: ${APEX_HOST:-lxzxai.com}
      NEXT_PUBLIC_APEX_HOST: ${APEX_HOST:-lxzxai.com}
      WEB_PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev

  # Optional edge entry on :8080 (trusted Host / XFH). Profile: nginx
  nginx:
    image: nginx:1.28-alpine
    profiles: ["nginx"]
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    environment:
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-local-dev-proxy-secret}
      NGINX_ENVSUBST_FILTER: PROXY_SHARED_SECRET
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  api_storage:
  hf_cache:
  web_node_modules:
